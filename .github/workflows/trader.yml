name: Gemini Autonomous Trader

on:
  # Disparado exclusivamente por cron-job.org (o manualmente con botón)
  workflow_dispatch:

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest
    env:
      TZ: 'America/Santiago'
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar ciclo de análisis y trading con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u main.py --run-once

      - name: Guardar portafolio, dashboard y log actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json trading.log README.md
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Actualización automática del portafolio [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              git push && break || sleep 3
            done
          fi
